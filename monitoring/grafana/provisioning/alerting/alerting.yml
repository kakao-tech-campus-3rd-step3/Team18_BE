# Grafana Unified Alerting Configuration
# 참고: https://grafana.com/docs/grafana/latest/alerting/set-up/provision-alerting-resources/

apiVersion: 1

# Contact Points - 알림을 받을 채널 설정
contactPoints:
  - orgId: 1
    name: dongarium-alerts
    receivers:
      # Discord Webhook (기존 logback-discord-appender와 동일한 채널 사용 권장)
      - uid: discord-webhook
        type: discord
        settings:
          url: ${DISCORD_WEBHOOK_URL}
          use_discord_username: false
          username: Monitoring Bot
        disableResolveMessage: false

# Notification Policies - 알림 라우팅 정책
policies:
  - orgId: 1
    receiver: dongarium-alerts
    group_by:
      - grafana_folder
      - alertname
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h

# Alert Rules - 알림 규칙 정의
groups:
  # ============================================
  # System Resource Alerts (USE Method)
  # ============================================
  - orgId: 1
    name: System Resource Alerts
    folder: Dongarium Alerts
    interval: 1m
    rules:
      # CPU 사용률 높음 (90% 이상 5분 지속)
      - uid: alert-high-cpu
        title: High CPU Usage
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: Prometheus
            model:
              expr: system_cpu_usage{application="dongarium"} * 100
              instant: false
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: []
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: mean
              refId: B
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 90
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        for: 5m
        annotations:
          summary: "CPU usage is above 90%"
          description: "System CPU usage has been above 90% for more than 5 minutes. Current value: {{ $values.B.Value }}%"
        labels:
          severity: critical
          category: system
        noDataState: NoData
        execErrState: Error

      # Heap 메모리 사용률 높음 (85% 이상 5분 지속)
      - uid: alert-high-heap
        title: High Heap Memory Usage
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: Prometheus
            model:
              expr: sum(jvm_memory_used_bytes{application="dongarium", area="heap"}) / sum(jvm_memory_max_bytes{application="dongarium", area="heap"}) * 100
              instant: false
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: mean
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 85
                    type: gt
              expression: B
              refId: C
              type: threshold
        for: 5m
        annotations:
          summary: "Heap memory usage is above 85%"
          description: "JVM Heap memory usage has been above 85% for more than 5 minutes. Current value: {{ $values.B.Value }}%"
        labels:
          severity: warning
          category: jvm
        noDataState: NoData
        execErrState: Error

  # ============================================
  # HTTP/API Alerts (RED Method)
  # ============================================
  - orgId: 1
    name: HTTP API Alerts
    folder: Dongarium Alerts
    interval: 1m
    rules:
      # 5xx 에러율 높음 (5% 이상 3분 지속)
      - uid: alert-high-error-rate
        title: High 5xx Error Rate
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 180
              to: 0
            datasourceUid: Prometheus
            model:
              expr: sum(rate(http_server_requests_seconds_count{application="dongarium", status=~"5.."}[5m])) / sum(rate(http_server_requests_seconds_count{application="dongarium"}[5m])) * 100
              instant: false
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              expression: A
              reducer: mean
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 5
                    type: gt
              expression: B
              refId: C
              type: threshold
        for: 3m
        annotations:
          summary: "5xx error rate is above 5%"
          description: "Server error rate has been above 5% for more than 3 minutes. Current value: {{ $values.B.Value }}%"
        labels:
          severity: critical
          category: http
        noDataState: NoData
        execErrState: Error

      # P95 응답 시간 높음 (1초 이상 5분 지속)
      - uid: alert-high-latency
        title: High Response Time (P95)
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: Prometheus
            model:
              expr: histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket{application="dongarium"}[5m])) by (le))
              instant: false
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              expression: A
              reducer: mean
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: gt
              expression: B
              refId: C
              type: threshold
        for: 5m
        annotations:
          summary: "P95 response time is above 1 second"
          description: "95th percentile response time has been above 1 second for more than 5 minutes. Current value: {{ $values.B.Value }}s"
        labels:
          severity: warning
          category: http
        noDataState: NoData
        execErrState: Error

  # ============================================
  # JVM Alerts
  # ============================================
  - orgId: 1
    name: JVM Alerts
    folder: Dongarium Alerts
    interval: 1m
    rules:
      # GC 시간 높음 (초당 500ms 이상 GC 시간 5분 지속)
      - uid: alert-high-gc-time
        title: High GC Pause Time
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: Prometheus
            model:
              expr: rate(jvm_gc_pause_seconds_sum{application="dongarium"}[5m]) * 1000
              instant: false
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              expression: A
              reducer: mean
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 500
                    type: gt
              expression: B
              refId: C
              type: threshold
        for: 5m
        annotations:
          summary: "GC pause time is high"
          description: "Garbage collection is taking significant time (>500ms/s). This may indicate memory pressure. Current value: {{ $values.B.Value }}ms/s"
        labels:
          severity: warning
          category: jvm
        noDataState: NoData
        execErrState: Error

      # Thread 수 급증 (500개 이상)
      - uid: alert-high-threads
        title: High Thread Count
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: Prometheus
            model:
              expr: jvm_threads_live_threads{application="dongarium"}
              instant: false
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 500
                    type: gt
              expression: B
              refId: C
              type: threshold
        for: 5m
        annotations:
          summary: "Thread count is unusually high"
          description: "JVM has more than 500 live threads. This may indicate a thread leak. Current value: {{ $values.B.Value }}"
        labels:
          severity: warning
          category: jvm
        noDataState: NoData
        execErrState: Error

  # ============================================
  # Database Connection Pool Alerts
  # ============================================
  - orgId: 1
    name: Database Alerts
    folder: Dongarium Alerts
    interval: 1m
    rules:
      # DB 커넥션 풀 고갈 (pending connections 5개 이상 3분 지속)
      - uid: alert-db-pool-exhausted
        title: Database Connection Pool Exhausted
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 180
              to: 0
            datasourceUid: Prometheus
            model:
              expr: hikaricp_connections_pending{application="dongarium"}
              instant: false
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              expression: A
              reducer: mean
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 5
                    type: gt
              expression: B
              refId: C
              type: threshold
        for: 3m
        annotations:
          summary: "Database connection pool is exhausted"
          description: "There are pending database connection requests. The connection pool may be exhausted. Pending connections: {{ $values.B.Value }}"
        labels:
          severity: critical
          category: database
        noDataState: NoData
        execErrState: Error

  # ============================================
  # Application Health Alerts
  # ============================================
  - orgId: 1
    name: Application Health Alerts
    folder: Dongarium Alerts
    interval: 1m
    rules:
      # 애플리케이션 다운 (메트릭 수집 실패)
      - uid: alert-app-down
        title: Application Down
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 120
              to: 0
            datasourceUid: Prometheus
            model:
              expr: up{job="dongarium-app"}
              instant: false
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: lt
              expression: B
              refId: C
              type: threshold
        for: 1m
        annotations:
          summary: "Application is down"
          description: "Prometheus cannot scrape metrics from the application. The application may be down or unreachable."
        labels:
          severity: critical
          category: availability
        noDataState: Alerting
        execErrState: Alerting