spring.application.name=Team18_BE
notification.result.max-sms-per-request=${NOTIFICATION_RESULT_MAX_SMS_PER_REQUEST:50}
notification.result.max-solapi-calls-per-hour=${NOTIFICATION_RESULT_MAX_SOLAPI_CALLS_PER_HOUR:50}
notification.result.max-solapi-calls-per-day=${NOTIFICATION_RESULT_MAX_SOLAPI_CALLS_PER_DAY:50}
notification.result.max-solapi-calls-per-month=${NOTIFICATION_RESULT_MAX_SOLAPI_CALLS_PER_MONTH:1500}
notification.result.max-solapi-estimated-cost-per-month=${NOTIFICATION_RESULT_MAX_SOLAPI_ESTIMATED_COST_PER_MONTH:0}
notification.sms.estimated-cost.sms=${NOTIFICATION_SMS_ESTIMATED_COST_SMS:0}
notification.sms.estimated-cost.lms=${NOTIFICATION_SMS_ESTIMATED_COST_LMS:0}
notification.dispatch.enabled=${NOTIFICATION_DISPATCH_ENABLED:true}
notification.dispatch.scheduler-delay-ms=${NOTIFICATION_DISPATCH_SCHEDULER_DELAY_MS:30000}
notification.dispatch.batch-size=${NOTIFICATION_DISPATCH_BATCH_SIZE:50}
notification.dispatch.max-attempts=${NOTIFICATION_DISPATCH_MAX_ATTEMPTS:5}
notification.dispatch.initial-retry-delay-seconds=${NOTIFICATION_DISPATCH_INITIAL_RETRY_DELAY_SECONDS:60}
notification.dispatch.max-retry-delay-seconds=${NOTIFICATION_DISPATCH_MAX_RETRY_DELAY_SECONDS:3600}
notification.dispatch.sending-timeout-seconds=${NOTIFICATION_DISPATCH_SENDING_TIMEOUT_SECONDS:600}
notification.status.scheduler-delay-ms=${NOTIFICATION_STATUS_SCHEDULER_DELAY_MS:60000}
notification.status.batch-size=${NOTIFICATION_STATUS_BATCH_SIZE:50}
notification.status.check-interval-seconds=${NOTIFICATION_STATUS_CHECK_INTERVAL_SECONDS:60}
notification.status.max-accepted-age-hours=${NOTIFICATION_STATUS_MAX_ACCEPTED_AGE_HOURS:24}
notification.monitoring.enabled=${NOTIFICATION_MONITORING_ENABLED:true}
notification.monitoring.scheduler-delay-ms=${NOTIFICATION_MONITORING_SCHEDULER_DELAY_MS:300000}
notification.monitoring.failure-alert-batch-size=${NOTIFICATION_MONITORING_FAILURE_ALERT_BATCH_SIZE:100}
solapi.enabled=${SOLAPI_ENABLED:false}
solapi.api-key=${SOLAPI_API_KEY:}
solapi.api-secret=${SOLAPI_API_SECRET:}
solapi.sender-number=${SOLAPI_SENDER_NUMBER:${SOLAPI_SENDER:}}
