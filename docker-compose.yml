name: dongarium-stack

services:
  db:
    image: mysql:8.0
    container_name: dongarium-mysql
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      TZ: Asia/Seoul
    command: [
      "--default-authentication-plugin=mysql_native_password",
      "--character-set-server=utf8mb4",
      "--collation-server=utf8mb4_unicode_ci",
      "--max_connections=200"
    ]
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: dongarium-redis
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # 1회 실행용 (배포 스크립트에서 `compose run --rm migrate`로 실행)
  # 최초 배포 시 기존 DB가 있다면 FLYWAY_BASELINE_ON_MIGRATE=true 옵션으로
  # baseline을 찍은 후 해당 옵션을 제거할 것
  migrate:
    image: ${ECR_REGISTRY}/dongarium-migrate:${IMAGE_TAG}
    container_name: dongarium-migrate
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: Asia/Seoul
      FLYWAY_URL: jdbc:mysql://db:3306/${DB_NAME}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      FLYWAY_USER: ${DB_USER}
      FLYWAY_PASSWORD: ${DB_PASSWORD}
      FLYWAY_BASELINE_ON_MIGRATE: "true"
      FLYWAY_BASELINE_VERSION: "1"
    command: ["migrate"]
    restart: "no"

  app:
    image: ${ECR_REGISTRY}/dongarium-server:${IMAGE_TAG}
    container_name: dongarium-server
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      # Spring Profile
      SPRING_PROFILES_ACTIVE: prod

      # MySQL 관련
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/${DB_NAME}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}

      # Kakao OAuth2
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET}
      KAKAO_REDIRECT_URI_PROD: ${KAKAO_REDIRECT_URI_PROD}
      KAKAO_LOGOUT_REDIRECT_URI_PROD: ${KAKAO_LOGOUT_REDIRECT_URI_PROD}
      FRONTEND_MAIN_PAGE_URI_PROD: ${FRONTEND_MAIN_PAGE_URI_PROD}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KAKAO_REDIRECT_URI: ${KAKAO_REDIRECT_URI_PROD}

      # JWT
      JWT_SECRET: ${JWT_SECRET}

      # Mail
      SPRING_MAIL_HOST: ${SMTP_HOST}
      SPRING_MAIL_PORT: ${SMTP_PORT}
      SPRING_MAIL_USERNAME: ${SMTP_USERNAME}
      SPRING_MAIL_PASSWORD: ${SMTP_PASSWORD}
      EMAIL_FROM: ${EMAIL_FROM}
      SPRING_EMAIL_SUBJECT_PREFIX: ${EMAIL_SUBJECT_PREFIX}

      # Redis
      SPRING_DATA_REDIS_HOST: ${REDIS_HOST}
      SPRING_DATA_REDIS_PORT: ${REDIS_PORT}

      # AWS S3
      CLOUD_AWS_S3_BUCKET: ${CLOUD_AWS_S3_BUCKET}
      CLOUD_AWS_S3_BUCKET_ATTACHMENTS: ${CLOUD_AWS_S3_BUCKET_ATTACHMENTS}
      CLOUD_AWS_REGION_STATIC: ${CLOUD_AWS_REGION_STATIC}

      # RestClient 타임아웃
      API_REST-CLIENT_CONNECT-TIMEOUT: ${API_REST_CLIENT_CONNECT_TIMEOUT:-3000}
      API_REST-CLIENT_READ-TIMEOUT: ${API_REST_CLIENT_READ_TIMEOUT:-3000}

      # Logging
      LOGGING_DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL}

    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'" ]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 30s

networks:
  default:
    name: dongarium-net

volumes:
  db_data:
